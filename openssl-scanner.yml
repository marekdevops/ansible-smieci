---
- name: Audyt konfiguracji OpenSSL - RHEL 9.7
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Sprawdzenie wersji systemu
      set_fact:
        is_rhel_9_7: "{{ ansible_distribution == 'RedHat' and ansible_distribution_version is version('9.7', '>=') }}"

    - name: Weryfikacja obecnosci starego wpisu (openssl.config)
      ansible.builtin.command: "grep -E '^.include.*/openssl.config' /etc/pki/tls/openssl.cnf"
      register: check_old
      failed_when: false
      changed_when: false

    - name: Weryfikacja obecnosci nowego wpisu (opensslcnf.config)
      ansible.builtin.command: "grep -E '^.include.*/opensslcnf.config' /etc/pki/tls/openssl.cnf"
      register: check_new
      failed_when: false
      changed_when: false

    - name: Klasyfikacja statusu
      set_fact:
        host_audit_status: >-
          {% if not is_rhel_9_7 %}
          Ignorowany (Wersja {{ ansible_distribution_version }})
          {% elif check_old.rc == 0 and check_new.rc == 0 %}
          ZAGROŻONY (Wykryto oba include - ryzyko błędu @SECLEVEL)
          {% elif check_old.rc == 0 and check_new.rc != 0 %}
          STARY_FORMAT (Tylko openssl.config)
          {% elif check_old.rc != 0 and check_new.rc == 0 %}
          OK (Poprawna konfiguracja RHEL 9.7)
          {% else %}
          NIEZNANY (Brak standardowych wpisów include)
          {% endif %}

    - name: Wyswietlenie wyniku
      debug:
        msg: "Host: {{ inventory_hostname }} | Status: {{ host_audit_status }}"

    - name: Zapis raportu do pliku na maszynie lokalnej
      delegate_to: localhost
      become: no
      ansible.builtin.lineinfile:
        path: "./raport_openssl_rhel97.csv"
        line: "{{ inventory_hostname }},{{ ansible_distribution_version }},{{ host_audit_status }}"
        create: yes
      run_once: false