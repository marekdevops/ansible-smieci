---
- name: Audyt konfiguracji OpenSSL - RHEL 9.7
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Sprawdzenie wersji systemu
      set_fact:
        is_rhel_9_7: "{{ ansible_distribution == 'RedHat' and ansible_distribution_version is version('9.7', '>=') }}"

    - name: Szukanie starego wpisu (openssl.config)
      ansible.builtin.command: "grep -E '^\\.include.*/openssl\\.config' /etc/pki/tls/openssl.cnf"
      register: grep_old
      failed_when: false
      changed_when: false

    - name: Szukanie nowego wpisu (opensslcnf.config)
      ansible.builtin.command: "grep -E '^\\.include.*/opensslcnf\\.config' /etc/pki/tls/openssl.cnf"
      register: grep_new
      failed_when: false
      changed_when: false

    - name: Analiza statusu
      set_fact:
        audit_result: >-
          {% if not is_rhel_9_7 %}
          Ignorowany (Wersja {{ ansible_distribution_version }})
          {% elif grep_old.rc == 0 and grep_new.rc == 0 %}
          ZAGROŻONY (Wykryto zdublowany include - błąd @SECLEVEL prawdopodobny)
          {% elif grep_old.rc == 0 and grep_new.rc != 0 %}
          STARY_FORMAT (Tylko openssl.config - do sprawdzenia)
          {% elif grep_old.rc != 0 and grep_new.rc == 0 %}
          OK (Poprawny include dla RHEL 9.7)
          {% else %}
          NIESTANDARDOWY (Brak automatycznych include-ów)
          {% endif %}

    - name: Wynik dla hosta
      debug:
        msg: "Host: {{ inventory_hostname }} | Status: {{ audit_result }}"

    - name: Zapis do raportu zbiorczego
      delegate_to: localhost
      become: no
      ansible.builtin.lineinfile:
        path: "./raport_openssl_97.csv"
        line: "{{ inventory_hostname }};{{ ansible_distribution_version }};{{ audit_result }}"
        create: yes
      run_once: false