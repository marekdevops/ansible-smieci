---
- name: Raport podatności OpenSSL na błąd @SECLEVEL w RHEL 9.7
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Sprawdzenie wersji systemu
      set_fact:
        is_rhel_9_7: "{{ ansible_distribution == 'RedHat' and ansible_distribution_version is version('9.7', '>=') }}"

    - name: Sprawdzenie obecności starego include (openssl.config)
      ansible.builtin.shell: "grep -q '^.include.*/openssl.config' /etc/pki/tls/openssl.cnf"
      register: old_check
      failed_when: false
      changed_when: false

    - name: Sprawdzenie obecności nowego include (opensslcnf.config)
      ansible.builtin.shell: "grep -q '^.include.*/opensslcnf.config' /etc/pki/tls/openssl.cnf"
      register: new_check
      failed_when: false
      changed_when: false

    - name: Klasyfikacja statusu hosta
      set_fact:
        host_status: >-
          {% if not is_rhel_9_7 %}
          Ignorowany (Wersja poniżej 9.7)
          {% elif old_check.rc == 0 and new_check.rc == 0 %}
          ZAGROŻONY (Wykryto oba include - ryzyko błędu @SECLEVEL)
          {% elif old_check.rc == 0 and new_check.rc != 0 %}
          DO WERYFIKACJI (Tylko stary format include)
          {% elif old_check.rc != 0 and new_check.rc == 0 %}
          OK (Poprawna konfiguracja RHEL 9)
          {% else %}
          NIEZNANY (Brak standardowych dyrektyw include)
          {% endif %}

    - name: Wyświetlenie raportu dla hosta
      debug:
        msg: "Host: {{ inventory_hostname }} | Status: {{ host_status }}"

    - name: Zapisanie wyników do lokalnego pliku raportu
      delegate_to: localhost
      become: no
      lineinfile:
        path: ./openssl_audit_report.txt
        line: "{{ inventory_hostname }}, {{ ansible_distribution_version }}, {{ host_status }}"
        create: yes
      run_once: false