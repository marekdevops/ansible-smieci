---
- name: Check BesClient process status on target hosts
  hosts: all
  gather_facts: yes
  become: no
  
  vars:
    process_name: "BesClient"
    
  tasks:
    - name: Check if BesClient process is running
      shell: |
        if pgrep -f "{{ process_name }}" > /dev/null; then
          echo "RUNNING"
        else
          echo "NOT_RUNNING"
        fi
      register: process_status
      changed_when: false
      failed_when: false

    - name: Get detailed process information if running
      shell: |
        ps aux | grep "{{ process_name }}" | grep -v grep || echo "No process found"
      register: process_details
      changed_when: false
      failed_when: false
      when: process_status.stdout == "RUNNING"

    - name: Get process count
      shell: |
        pgrep -f "{{ process_name }}" | wc -l
      register: process_count
      changed_when: false
      failed_when: false

    - name: Get system uptime
      shell: uptime
      register: system_uptime
      changed_when: false
      failed_when: false

    - name: Display host status
      debug:
        msg: |
          ==========================================
          HOST: {{ inventory_hostname }}
          ==========================================
          IP Address: {{ ansible_default_ipv4.address | default('N/A') }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version | default('Unknown') }}
          Process Status: {{ process_status.stdout }}
          Process Count: {{ process_count.stdout | default('0') }}
          System Uptime: {{ system_uptime.stdout | default('N/A') }}
          Check Time: {{ ansible_date_time.iso8601 }}
          {% if process_status.stdout == 'RUNNING' %}
          Process Details:
          {{ process_details.stdout | default('N/A') }}
          {% endif %}

    - name: Create summary for this host
      debug:
        msg: |
          {% if process_status.stdout == 'RUNNING' %}
          ✅ SUCCESS: BesClient is RUNNING on {{ inventory_hostname }}
          {% else %}
          ❌ WARNING: BesClient is NOT RUNNING on {{ inventory_hostname }}
          {% endif %}

    - name: Create individual host report file
      copy:
        content: |
          BesClient Status Report for {{ inventory_hostname }}
          =====================================================
          Generated: {{ ansible_date_time.iso8601 }}
          
          HOST INFORMATION:
          Hostname: {{ inventory_hostname }}
          IP Address: {{ ansible_default_ipv4.address | default('N/A') }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version | default('Unknown') }}
          OS Family: {{ ansible_os_family | default('Unknown') }}
          
          PROCESS STATUS:
          BesClient Status: {{ process_status.stdout }}
          Process Count: {{ process_count.stdout | default('0') }}
          System Uptime: {{ system_uptime.stdout | default('N/A') }}
          Check Time: {{ ansible_date_time.iso8601 }}
          
          {% if process_status.stdout == 'RUNNING' %}
          PROCESS DETAILS:
          {{ process_details.stdout | default('No details available') }}
          {% else %}
          ISSUE: BesClient process is not running on this host!
          {% endif %}
          
          =====================================================
        dest: "/tmp/besclient_{{ inventory_hostname }}_{{ ansible_date_time.epoch }}.txt"
        mode: '0644'

    - name: Show report file location
      debug:
        msg: |
          📄 Individual report saved to: /tmp/besclient_{{ inventory_hostname }}_{{ ansible_date_time.epoch }}.txt
