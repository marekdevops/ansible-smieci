awk 'BEGIN {c=0} /BEGIN CERTIFICATE/ {c++} {print > "cert" c ".tmp"}' twoj_plik.pem

for f in cert*.tmp; do
    echo "--- Plik: $f ---"
    openssl x509 -noout -subject -issuer -in "$f"
    rm "$f"
done

openssl crl2pkcs7 -nocrl -certfile twoj_plik.pem | openssl pkcs7 -print_certs -text | grep -E "Subject:|Issuer:"


# Sprawdź dokładnie jak przekazywany jest argument do JVM
oc exec <pod> -n <ns> -- cat /proc/1/cmdline | tr '\0' '\n' | grep -iE "trust|ssl|javax"

# Sprawdź zmienne środowiskowe — może JAVA_OPTS jest ale inaczej nazwany
oc exec <pod> -n <ns> -- env | grep -iE "java|jvm|opt|trust"


# Utwórz pustą configmapę z właściwym labelem
oc create configmap ca-bundle -n <app-namespace>

oc label configmap ca-bundle \
  config.openshift.io/inject-trusted-cabundle=true \
  -n <app-namespace>