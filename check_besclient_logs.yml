---
- name: Run BESClient Log Checker Script
  hosts: all
  become: yes
  vars:
    script_path: "/opt/scripts/check_processsh"  # Ścieżka do skryptu na zdalnym hoście
    debug_mode: "0"  # Ustaw na "1" aby włączyć tryb debug
    local_reports_dir: "/home/marek/CODE/ansible-smieci/reports"  # Lokalny katalog na raporty
    
  tasks:
    - name: Check if script exists on remote host
      stat:
        path: "{{ script_path }}"
      register: remote_script_stat

    - name: Fail if script doesn't exist on remote host
      fail:
        msg: "Script {{ script_path }} not found on {{ inventory_hostname }}!"
      when: not remote_script_stat.stat.exists

    - name: Ensure script is executable
      file:
        path: "{{ script_path }}"
        mode: '0755'

    - name: Run BESClient log checker script
      shell: "{{ script_path }}"
      register: script_output
      changed_when: false
      failed_when: script_output.rc not in [0, 2, 3]
      environment:
        DEBUG: "{{ debug_mode | default('0') }}"

    - name: Display script results
      debug:
        msg: |
          ================================================================
          BESClient Log Checker Results for {{ inventory_hostname }}
          ================================================================
          {{ script_output.stdout }}
          
          Exit Code: {{ script_output.rc }}
          {% if script_output.rc == 0 %}
          Status: SUCCESS - All log files contain recent successful reports
          {% elif script_output.rc == 2 %}
          Status: WARNING - No successful reports found in the last hour
          {% elif script_output.rc == 3 %}
          Status: PARTIAL SUCCESS - Some files contain recent successful reports
          {% else %}
          Status: ERROR - Script execution failed
          {% endif %}

    - name: Show stderr if any errors occurred
      debug:
        msg: |
          STDERR Output:
          {{ script_output.stderr }}
      when: script_output.stderr | length > 0

    - name: Extract report file path from script output
      set_fact:
        report_file_path: "{{ script_output.stdout | regex_search('Raport zapisany w: (.+)', '\\1') | first }}"
      when: script_output.stdout is defined and 'Raport zapisany w:' in script_output.stdout

    - name: Create local reports directory
      local_action:
        module: file
        path: "{{ local_reports_dir }}"
        state: directory
        mode: '0755'
      run_once: true

    - name: Copy report file to local machine
      fetch:
        src: "{{ report_file_path }}"
        dest: "{{ local_reports_dir }}/{{ inventory_hostname }}_{{ report_file_path | basename }}"
        flat: yes
      when: report_file_path is defined and report_file_path | length > 0

    - name: Display local report path
      debug:
        msg: "Raport skopiowany do: {{ local_reports_dir }}/{{ inventory_hostname }}_{{ report_file_path | basename }}"
      when: report_file_path is defined and report_file_path | length > 0
