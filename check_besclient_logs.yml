---
- name: Run BESClient Log Checker Script
  hosts: all
  become: yes
  vars:
    script_name: check_processsh
    local_script_path: "/home/marek/CODE/ansible-smieci/{{ script_name }}"
    remote_script_path: "/tmp/{{ script_name }}"
    debug_mode: "0"  # Ustaw na "1" aby włączyć tryb debug
    
  tasks:
    - name: Check if local script exists
      local_action:
        module: stat
        path: "{{ local_script_path }}"
      register: local_script_stat
      run_once: true

    - name: Fail if local script doesn't exist
      fail:
        msg: "Script {{ local_script_path }} not found!"
      when: not local_script_stat.stat.exists

    - name: Copy script to remote host
      copy:
        src: "{{ local_script_path }}"
        dest: "{{ remote_script_path }}"
        mode: '0755'
        owner: root
        group: root

    - name: Run BESClient log checker script
      shell: "{{ remote_script_path }}"
      register: script_output
      changed_when: false
      failed_when: script_output.rc not in [0, 2, 3]
      environment:
        DEBUG: "{{ debug_mode | default('0') }}"

    - name: Display script results
      debug:
        msg: |
          ================================================================
          BESClient Log Checker Results for {{ inventory_hostname }}
          ================================================================
          {{ script_output.stdout }}
          
          Exit Code: {{ script_output.rc }}
          {% if script_output.rc == 0 %}
          Status: SUCCESS - All log files contain recent successful reports
          {% elif script_output.rc == 2 %}
          Status: WARNING - No successful reports found in the last hour
          {% elif script_output.rc == 3 %}
          Status: PARTIAL SUCCESS - Some files contain recent successful reports
          {% else %}
          Status: ERROR - Script execution failed
          {% endif %}

    - name: Show stderr if any errors occurred
      debug:
        msg: |
          STDERR Output:
          {{ script_output.stderr }}
      when: script_output.stderr | length > 0

    - name: Clean up temporary script
      file:
        path: "{{ remote_script_path }}"
        state: absent

  handlers:
    - name: cleanup script
      file:
        path: "{{ remote_script_path }}"
        state: absent
